name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend-nest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-nest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "1414"
          POSTGRES_DB: viajero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viajero"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:1414@localhost:5432/viajero
      DEFAULT_LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-nest/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Migrations e seed em banco vazio
        run: npm run db:setup
      - name: Smoke HTTP contra a API compilada
        run: |
          PORT=8001 node dist/main.js &
          for i in $(seq 1 30); do curl -sf http://localhost:8001/api/destinations/ >/dev/null && break; sleep 1; done
          npm run smoke

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
